events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1000;

    # Security Headers (applied to all responses)
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Rate limiting zone (10 req/s per IP)
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

    # --- HTTP → HTTPS redirect ---
    server {
        listen 80;
        server_name _;

        # Redirect all HTTP to HTTPS
        return 301 https://$host$request_uri;
    }

    # --- HTTPS server ---
    server {
        listen 443 ssl;
        server_name _;

        ssl_certificate     /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # HSTS (1 year)
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Proxy settings
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Max upload size (for record file uploads)
        client_max_body_size 100M;

        # Health check — no rate limiting (used by Docker healthcheck)
        location = /api/health {
            proxy_pass http://web:3000;
        }

        # MinIO file proxy — serves uploaded files to the browser
        location /files/ {
            proxy_pass http://minio:9000/uploads/;
            proxy_set_header Host minio:9000;
            proxy_hide_header x-amz-request-id;
            proxy_hide_header x-amz-meta-server-side-encryption;
            proxy_hide_header x-amz-server-side-encryption;
        }

        # API routes — apply rate limiting
        location /api/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://web:3000;
        }

        # Static assets — long cache
        location /_next/static/ {
            proxy_pass http://web:3000;
            expires 365d;
            add_header Cache-Control "public, immutable";
        }

        # Everything else
        location / {
            proxy_pass http://web:3000;
        }
    }
}
