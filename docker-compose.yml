services:
  postgres:
    image: postgres:16-alpine
    container_name: erm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-erm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-erm}
      POSTGRES_DB: ${POSTGRES_DB:-erm}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - erm-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-erm}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: erm-redis
    restart: unless-stopped
    command: ["redis-server", "--save", "20", "1", "--requirepass", "${REDIS_PASSWORD:-changeme}"]
    networks:
      - erm-internal
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-changeme}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  meilisearch:
    image: getmeili/meilisearch:v1.12
    container_name: erm-meilisearch
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-erm-search-master-key-change-me}
      MEILI_ENV: production
    volumes:
      - meili_data:/meili_data
    networks:
      - erm-internal
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: quay.io/minio/minio:latest
    container_name: erm-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    networks:
      - erm-internal
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-create-bucket:
    image: quay.io/minio/mc:latest
    container_name: erm-minio-create-bucket
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - erm-internal
    entrypoint: >
      /bin/sh -c "
        sleep 10;
        mc alias set minio http://minio:9000 $MINIO_ROOT_USER $MINIO_ROOT_PASSWORD;
        mc mb -p minio/$MINIO_BUCKET;
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-uploads}

  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        DATABASE_URL: ${DATABASE_URL:-postgresql://erm:erm@postgres:5432/erm}
    container_name: erm-web
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-create-bucket:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-erm}:${POSTGRES_PASSWORD:-erm}@postgres:5432/${POSTGRES_DB:-erm}
      REDIS_URL: redis://:${REDIS_PASSWORD:-changeme}@redis:6379
      MEILI_URL: http://meilisearch:7700
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-erm-search-master-key-change-me}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_BUCKET: ${MINIO_BUCKET:-uploads}
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-http://localhost:9000}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-changeme}
    networks:
      - erm-internal
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  nginx:
    image: nginx:1.27-alpine
    container_name: erm-nginx
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/ssl:/etc/nginx/ssl:ro
    networks:
      - erm-internal

  pg-backup:
    image: postgres:16-alpine
    container_name: erm-pg-backup
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backups:/backups
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-erm}
      PGPASSWORD: ${POSTGRES_PASSWORD:-erm}
      PGDATABASE: ${POSTGRES_DB:-erm}
    networks:
      - erm-internal
    entrypoint: >
      /bin/sh -c "
        echo '[pg-backup] Starting backup loop...';
        while true; do
          FILENAME=/backups/erm-$$(date +%Y%m%d-%H%M%S).dump;
          echo \"[pg-backup] Creating $$FILENAME\";
          pg_dump -Fc -f $$FILENAME;
          echo \"[pg-backup] Pruning backups older than 7 days\";
          find /backups -name '*.dump' -mtime +7 -delete;
          echo \"[pg-backup] Next backup in 24 hours\";
          sleep 86400;
        done
      "

networks:
  erm-internal:
    driver: bridge

volumes:
  postgres_data:
  minio_data:
  meili_data:
